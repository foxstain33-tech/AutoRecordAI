name: Build Android APK (with API Key)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-with-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
    
    steps:
      - name: Checkout code (force fresh)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --info
        
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoRecordAI-with-api
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          
      - name: Release APK
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0-api-build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}