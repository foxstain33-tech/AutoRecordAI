name: Build Android APK (with API Key)

on:
  workflow_dispatch:

jobs:
  build-with-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Write DOUBAO_API_KEY to gradle.properties
        run: |
          echo "DOUBAO_API_KEY=${{ secrets.DOUBAO_API_KEY }}" >> gradle.properties
          echo "验证写入（隐藏密钥内容）:"
          grep DOUBAO gradle.properties | sed 's/=.*/=***/'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRecordAI-with-api
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0-api-build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
