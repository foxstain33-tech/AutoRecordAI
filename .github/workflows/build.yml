name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRecordAI-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0-auto-build
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-with-api:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create config file
        env:
          XUNFEI_APP_ID: ${{ secrets.XUNFEI_APP_ID }}
          XUNFEI_API_KEY: ${{ secrets.XUNFEI_API_KEY }}
          XUNFEI_API_SECRET: ${{ secrets.XUNFEI_API_SECRET }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: |
          cat > AIProcessor.kt << 'EOF'
          // API configuration file
          const val XUNFEI_APP_ID = "${{ secrets.XUNFEI_APP_ID }}"
          const val XUNFEI_API_KEY = "${{ secrets.XUNFEI_API_KEY }}"
          const val XUNFEI_API_SECRET = "${{ secrets.XUNFEI_API_SECRET }}"
          const val DOUBAO_API_KEY = "${{ secrets.DOUBAO_API_KEY }}"
          EOF

      - name: Build APK with API config
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload API-enabled APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRecordAI-with-api
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30